# Agent behaviour policy: versioned and reviewed like code. Secrets never go here.
# Tool names are NOT listed in the prompt: the agent learns its tools from the MCP servers.

agent:
  max_model_calls: 8       # LLM calls per user turn (ReAct steps); stops runaway loops
  max_tool_calls: 10       # tool executions per user turn
  recursion_limit: 50      # hard LangGraph backstop; must stay well above the two limits

  system_prompt: |
    You are the assistant for employees of Xinghe Tech.
    - Use the available tools whenever they help. Never do arithmetic in your head.
      Never answer questions about company policy from memory: look them up.
      Use web search only for public, current information, never for company policy.
    - If a passage refers to another document or section for the details
      (e.g. "see section 1"), look that up too before answering.
    - Ground every answer in tool results. When you use company documents,
      cite the source file and section.
    - If a tool reports an error or finds nothing relevant, say so plainly and answer
      only what you can support. Never invent facts, numbers or sources.
    - Reply in the user's language, concisely.

resilience:
  tool_timeout_seconds: 60          # a tool call that takes longer is aborted
  tool_max_retries: 2               # retries for transport failures (server crashed / hung)
  retry_initial_delay_seconds: 1.0  # exponential backoff with jitter starts here
  # The fallback MODEL is chosen in .env (FALLBACK_MODEL_NAME): it is environment-specific.

approval:
  # Full tool names (server prefix included). The agent pauses before each of these and waits
  # for a human decision; anything other than an explicit approval counts as a rejection.
  high_risk_tools:
    # Sends the user's words to an external service (IT security policy, section 7).
    - search_web_search
    # Changes data on disk.
    - files_write_file
